[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speclab-spectrum-analyzer"
version = "0.2.0"
description = "Scientific IR and Raman spectrum analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SpecLab contributors" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
web = ["streamlit>=1.32"]
desktop = ["PySide6>=6.6"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools]
packages = ["speclab", "speclab.io", "speclab.processing", "speclab.analysis", "speclab.visualization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
